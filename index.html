<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0a0c0f" />
  <title>智慧採收輔助系統 </title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            industrial: {
              bg: '#0a0c0f',
              panel: '#12161c',
              border: '#2a3340',
              muted: '#8b97a8',
              text: '#f2f5f8',
              accent: '#ffb020',
              ok: '#22e06a',
              danger: '#ff3b3b',
              grip: '#ff8a00',
              release: '#1ec8ff',
            }
          },
          fontFamily: {
            display: ['"Noto Sans TC"', 'system-ui', 'sans-serif'],
          },
          boxShadow: {
            glowOk: '0 0 12px rgba(34, 224, 106, 0.85)',
            glowOff: '0 0 8px rgba(255, 59, 59, 0.55)',
            grip: '0 0 0 3px rgba(255, 138, 0, 0.35), 0 8px 24px rgba(0,0,0,0.55)',
            release: '0 0 0 3px rgba(30, 200, 255, 0.35), 0 8px 24px rgba(0,0,0,0.55)',
          }
        }
      }
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet" />
  <style>
    /* 單螢幕：禁止捲動、鎖高於可視區 */
    html, body {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      background: #0a0c0f;
      color: #f2f5f8;
      font-family: "Noto Sans TC", system-ui, sans-serif;
    }

    /* 工業風網格底紋（戶外可讀、不搶主控） */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(255, 176, 32, 0.12), transparent 55%),
        linear-gradient(rgba(42, 51, 64, 0.35) 1px, transparent 1px),
        linear-gradient(90deg, rgba(42, 51, 64, 0.35) 1px, transparent 1px);
      background-size: auto, 28px 28px, 28px 28px;
      opacity: 0.55;
      z-index: 0;
    }

    #app {
      position: relative;
      z-index: 1;
      height: 100dvh;
      height: 100vh;
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      padding: max(0.55rem, env(safe-area-inset-top))
               max(0.7rem, env(safe-area-inset-right))
               max(0.55rem, env(safe-area-inset-bottom))
               max(0.7rem, env(safe-area-inset-left));
    }

    .panel {
      background: rgba(18, 22, 28, 0.92);
      border: 1px solid #2a3340;
      border-radius: 0.75rem;
      backdrop-filter: blur(6px);
    }

    .status-dot {
      width: 0.85rem;
      height: 0.85rem;
      border-radius: 9999px;
      background: #ff3b3b;
      box-shadow: 0 0 8px rgba(255, 59, 59, 0.55);
      transition: background 0.2s ease, box-shadow 0.2s ease;
    }
    .status-dot.online {
      background: #22e06a;
      box-shadow: 0 0 12px rgba(34, 224, 106, 0.85);
      animation: pulseOk 1.6s ease-in-out infinite;
    }
    @keyframes pulseOk {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.15); opacity: 0.75; }
    }

    /* 巨型夾取按鈕：高對比、大觸控區 */
    #btnGrip {
      min-height: 7.5rem;
      font-size: clamp(1.75rem, 8vw, 2.35rem);
      font-weight: 900;
      letter-spacing: 0.08em;
      border-radius: 1rem;
      border: 3px solid currentColor;
      transition: transform 0.08s ease, filter 0.15s ease, background 0.2s ease, color 0.2s ease;
      user-select: none;
      -webkit-user-select: none;
    }
    #btnGrip:active { transform: scale(0.97); }
    #btnGrip.is-gripping {
      background: #ff8a00;
      color: #0a0c0f;
      box-shadow: 0 0 0 3px rgba(255, 138, 0, 0.35), 0 8px 24px rgba(0,0,0,0.55);
    }
    #btnGrip.is-released {
      background: #1ec8ff;
      color: #0a0c0f;
      box-shadow: 0 0 0 3px rgba(30, 200, 255, 0.35), 0 8px 24px rgba(0,0,0,0.55);
    }

    #consoleLog {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.68rem;
      line-height: 1.35;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: #2a3340 transparent;
    }
    #consoleLog .ts { color: #8b97a8; }
    #consoleLog .ok { color: #22e06a; }
    #consoleLog .warn { color: #ffb020; }
    #consoleLog .err { color: #ff3b3b; }
    #consoleLog .tx { color: #1ec8ff; }

    .metric-value {
      font-variant-numeric: tabular-nums;
      font-weight: 800;
      font-size: 1.15rem;
      color: #ffb020;
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- ========== 標題列 ========== -->
    <header class="panel px-3 py-2 flex items-center justify-between shrink-0">
      <div class="min-w-0">
        <h1 class="text-[0.95rem] font-black tracking-wide text-industrial-text truncate">
          智慧採收 · 數位雙生
        </h1>
        <p class="text-[0.65rem] text-industrial-muted truncate">雙模式微夾爪控制器 · ESP32-S</p>
      </div>
      <div class="flex items-center gap-2 shrink-0 pl-2">
        <span id="statusLabel" class="text-[0.7rem] font-bold text-industrial-muted">未連線</span>
        <span id="statusDot" class="status-dot" aria-hidden="true"></span>
      </div>
    </header>

    <!-- ========== 連線面板 ========== -->
    <section class="panel px-3 py-2.5 shrink-0" aria-label="連線設定">
      <label for="wsHost" class="block text-[0.7rem] font-bold text-industrial-muted mb-1">
        ESP32 WebSocket 位址
      </label>
      <div class="flex gap-2">
        <input
          id="wsHost"
          type="text"
          inputmode="url"
          autocomplete="off"
          spellcheck="false"
          placeholder="ws://192.168.4.1:81"
          value="ws://192.168.4.1:81"
          class="flex-1 min-w-0 rounded-lg bg-industrial-bg border border-industrial-border px-3 py-2.5 text-[0.9rem] font-semibold text-industrial-text placeholder:text-industrial-muted/60 focus:outline-none focus:border-industrial-accent"
        />
        <button
          id="btnConnect"
          type="button"
          class="shrink-0 rounded-lg bg-industrial-accent text-industrial-bg font-black text-[0.95rem] px-4 py-2.5 active:scale-95 transition"
        >
          連線
        </button>
      </div>
    </section>

    <!-- ========== 陀螺儀姿態 ========== -->
    <section class="panel px-3 py-2.5 shrink-0" aria-label="手機姿態">
      <div class="flex items-center justify-between mb-2 gap-2">
        <h2 class="text-[0.75rem] font-black text-industrial-text">即時姿態（陀螺儀）</h2>
        <button
          id="btnOrientPerm"
          type="button"
          class="rounded-md border border-industrial-accent text-industrial-accent text-[0.7rem] font-bold px-2.5 py-1.5 active:scale-95 transition"
        >
          啟用感測器
        </button>
      </div>
      <div class="grid grid-cols-3 gap-2 text-center">
        <div class="rounded-md bg-industrial-bg border border-industrial-border py-1.5">
          <div class="text-[0.6rem] font-bold text-industrial-muted">俯仰 Pitch</div>
          <div id="valPitch" class="metric-value">--.-°</div>
        </div>
        <div class="rounded-md bg-industrial-bg border border-industrial-border py-1.5">
          <div class="text-[0.6rem] font-bold text-industrial-muted">橫滾 Roll</div>
          <div id="valRoll" class="metric-value">--.-°</div>
        </div>
        <div class="rounded-md bg-industrial-bg border border-industrial-border py-1.5">
          <div class="text-[0.6rem] font-bold text-industrial-muted">偏航 Yaw</div>
          <div id="valYaw" class="metric-value">--.-°</div>
        </div>
      </div>
    </section>

    <!-- ========== 主致動器 ========== -->
    <section class="flex-1 flex flex-col justify-center min-h-0 shrink-0" aria-label="夾爪控制">
      <button
        id="btnGrip"
        type="button"
        class="is-released w-full"
        aria-pressed="false"
      >
        釋放
      </button>
      <p class="mt-2 text-center text-[0.65rem] text-industrial-muted font-semibold leading-snug">
        音量上鍵＝夾取 · 音量下鍵＝釋放<br />
        <span class="text-industrial-accent">可盲操作，無需看螢幕</span>
      </p>
    </section>

    <!-- ========== 系統主控台 ========== -->
    <section class="panel px-2.5 py-2 shrink-0 flex flex-col" style="height: 22%; min-height: 5.5rem; max-height: 8.5rem;" aria-label="系統主控台">
      <div class="flex items-center justify-between mb-1">
        <h2 class="text-[0.7rem] font-black text-industrial-text">系統主控台</h2>
        <button id="btnClearLog" type="button" class="text-[0.65rem] font-bold text-industrial-muted hover:text-industrial-text">
          清除
        </button>
      </div>
      <div id="consoleLog" class="flex-1 rounded-md bg-black/50 border border-industrial-border px-2 py-1.5" role="log" aria-live="polite"></div>
    </section>
  </div>

  <script>
    /* ============================================================================
     * 智慧採收輔助系統 · 數位雙生控制器
     * -----------------------------------------------------------------------------
     * 模組概覽：
     *   1) UI / Console     — 繁中介面、日誌
     *   2) GripActuator     — 夾取 / 釋放狀態機 + UI 同步
     *   3) VolumeKeyBinder  — 實體音量鍵攔截（盡力而為，見註解）
     *   4) OrientationSensor— DeviceOrientation API + iOS 權限
     *   5) Esp32Socket      — 低延遲 WebSocket 通訊（給 ESP32-S 對接）
     *
     * 建議 ESP32 端協定（JSON 文字幀）：
     *   瀏覽器 → ESP32
     *     {"cmd":"grip","state":"close"}   // 夾取
     *     {"cmd":"grip","state":"open"}    // 釋放
     *     {"cmd":"attitude","pitch":..,"roll":..,"yaw":..}
     *     {"cmd":"ping","t": <ms>}
     *   ESP32 → 瀏覽器（可選）
     *     {"evt":"ack","cmd":"grip","state":"close"}
     *     {"evt":"status","msg":"..."}
     * ============================================================================ */

    'use strict';

    // ---------------------------------------------------------------------------
    // 1) UI helpers & Console
    // ---------------------------------------------------------------------------
    const $ = (id) => document.getElementById(id);

    const el = {
      wsHost: $('wsHost'),
      btnConnect: $('btnConnect'),
      statusDot: $('statusDot'),
      statusLabel: $('statusLabel'),
      btnOrientPerm: $('btnOrientPerm'),
      valPitch: $('valPitch'),
      valRoll: $('valRoll'),
      valYaw: $('valYaw'),
      btnGrip: $('btnGrip'),
      consoleLog: $('consoleLog'),
      btnClearLog: $('btnClearLog'),
    };

    const MAX_LOG_LINES = 80;

    /**
     * 寫入主控台一行。
     * @param {string} message
     * @param {'ok'|'warn'|'err'|'tx'|'info'} [level='info']
     */
    function log(message, level = 'info') {
      const time = new Date().toLocaleTimeString('zh-TW', { hour12: false });
      const line = document.createElement('div');
      const levelClass = level === 'info' ? '' : level;
      line.innerHTML =
        `<span class="ts">[${time}]</span> ` +
        `<span class="${levelClass}">${escapeHtml(message)}</span>`;
      el.consoleLog.appendChild(line);
      while (el.consoleLog.childElementCount > MAX_LOG_LINES) {
        el.consoleLog.removeChild(el.consoleLog.firstChild);
      }
      el.consoleLog.scrollTop = el.consoleLog.scrollHeight;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function setConnectionUi(online) {
      el.statusDot.classList.toggle('online', online);
      el.statusLabel.textContent = online ? '已連線' : '未連線';
      el.statusLabel.className =
        'text-[0.7rem] font-bold ' + (online ? 'text-industrial-ok' : 'text-industrial-muted');
      el.btnConnect.textContent = online ? '斷線' : '連線';
    }

    el.btnClearLog.addEventListener('click', () => {
      el.consoleLog.innerHTML = '';
      log('主控台已清除', 'info');
    });

    // ---------------------------------------------------------------------------
    // 2) GripActuator — 夾取 / 釋放
    // ---------------------------------------------------------------------------
    const GripActuator = (() => {
      /** @type {boolean} true = 夾取中 (closed) */
      let gripping = false;

      function render() {
        el.btnGrip.classList.toggle('is-gripping', gripping);
        el.btnGrip.classList.toggle('is-released', !gripping);
        el.btnGrip.textContent = gripping ? '夾取' : '釋放';
        el.btnGrip.setAttribute('aria-pressed', gripping ? 'true' : 'false');
      }

      /**
       * 設定夾爪狀態並透過 WebSocket 下發指令。
       * @param {boolean} nextGripping
       * @param {string} [source='ui'] 觸發來源：ui | volume-up | volume-down
       */
      function setGripping(nextGripping, source = 'ui') {
        if (gripping === nextGripping) {
          log(`夾爪已是「${nextGripping ? '夾取' : '釋放'}」狀態（來源：${source}）`, 'warn');
          return;
        }
        gripping = nextGripping;
        render();

        const state = gripping ? 'close' : 'open';
        const label = gripping ? '夾取' : '釋放';
        log(`致動器 → ${label}（來源：${source}）`, 'ok');

        Esp32Socket.send({
          cmd: 'grip',
          state,           // "close" | "open"
          source,
          t: Date.now(),
        });
      }

      function toggle(source = 'ui') {
        setGripping(!gripping, source);
      }

      function grip(source = 'ui') {
        setGripping(true, source);
      }

      function release(source = 'ui') {
        setGripping(false, source);
      }

      function isGripping() {
        return gripping;
      }

      // 巨型主按鈕：點一次切換
      el.btnGrip.addEventListener('click', () => toggle('ui'));

      render();
      return { setGripping, toggle, grip, release, isGripping };
    })();

    // ---------------------------------------------------------------------------
    // 3) VolumeKeyBinder — 實體音量鍵 → 夾取 / 釋放
    // ---------------------------------------------------------------------------
    /**
     * 重要限制說明（請務必閱讀）：
     * - 多數行動瀏覽器（尤其 iOS Safari）基於安全政策，**不允許網頁攔截音量鍵**。
     * - Android Chrome / WebView / PWA（全螢幕）在部分機型上可收到 keydown。
     * - 桌面瀏覽器可用鍵盤模擬：ArrowUp / ArrowDown 作為開發測試替代鍵。
     * - preventDefault() 僅在瀏覽器允許時有效，無法保證隱藏系統音量 UI。
     */
    const VolumeKeyBinder = (() => {
      const VOLUME_UP_CODES = new Set([
        'AudioVolumeUp',
        'VolumeUp',
        'Volume Increment',
      ]);
      const VOLUME_DOWN_CODES = new Set([
        'AudioVolumeDown',
        'VolumeDown',
        'Volume Decrement',
      ]);

      // 防連發：硬體鍵常會重複觸發
      let lastFireAt = 0;
      const DEBOUNCE_MS = 220;

      function handleKeyEvent(e) {
        const code = e.code || '';
        const key = e.key || '';
        const keyCode = e.keyCode || e.which || 0;

        const isVolUp =
          VOLUME_UP_CODES.has(code) ||
          key === 'AudioVolumeUp' ||
          keyCode === 175 || // legacy Volume Up
          // 開發測試：桌面方向鍵上
          code === 'ArrowUp';

        const isVolDown =
          VOLUME_DOWN_CODES.has(code) ||
          key === 'AudioVolumeDown' ||
          keyCode === 174 || // legacy Volume Down
          // 開發測試：桌面方向鍵下
          code === 'ArrowDown';

        if (!isVolUp && !isVolDown) return;

        // 盡力阻止系統音量 UI / 頁面捲動
        e.preventDefault();
        e.stopPropagation();
        if (typeof e.stopImmediatePropagation === 'function') {
          e.stopImmediatePropagation();
        }

        const now = Date.now();
        if (now - lastFireAt < DEBOUNCE_MS) return;
        lastFireAt = now;

        if (isVolUp) {
          log('偵測到音量上鍵 → 夾取', 'ok');
          GripActuator.grip('volume-up');
        } else {
          log('偵測到音量下鍵 → 釋放', 'ok');
          GripActuator.release('volume-down');
        }
      }

      // capture 階段優先攔截
      window.addEventListener('keydown', handleKeyEvent, { capture: true, passive: false });
      window.addEventListener('keyup', handleKeyEvent, { capture: true, passive: false });

      // 部分 Android WebView 會用 media 相關事件；保留擴充點
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
          log('頁面恢復前景（音量鍵監聽仍作用中）', 'info');
        }
      });

      log('音量鍵綁定已啟用（音量上＝夾取 / 音量下＝釋放）', 'info');
      log('若實體鍵無效，請用主按鈕；桌面可用 ↑/↓ 測試', 'warn');

      return { handleKeyEvent };
    })();

    // ---------------------------------------------------------------------------
    // 4) OrientationSensor — DeviceOrientation API
    // ---------------------------------------------------------------------------
    const OrientationSensor = (() => {
      let enabled = false;
      let lastSentAt = 0;
      const SEND_INTERVAL_MS = 50; // ~20 Hz，兼顧低延遲與頻寬

      /** 目前姿態（度） */
      const attitude = { pitch: 0, roll: 0, yaw: 0 };

      function formatDeg(v) {
        if (!Number.isFinite(v)) return '--.-°';
        return `${v.toFixed(1)}°`;
      }

      function updateUi() {
        el.valPitch.textContent = formatDeg(attitude.pitch);
        el.valRoll.textContent = formatDeg(attitude.roll);
        el.valYaw.textContent = formatDeg(attitude.yaw);
      }

      /**
       * DeviceOrientation 事件處理。
       * 約定對應（便於與機械臂座標系對齊，可依硬體再調）：
       *   pitch ← beta   （前後傾斜，約 -180~180）
       *   roll  ← gamma  （左右傾斜，約 -90~90）
       *   yaw   ← alpha  （羅盤方位，0~360）
       */
      function onOrientation(event) {
        // iOS 可能提供 webkitCompassHeading；優先使用標準欄位
        const alpha = event.alpha; // yaw
        const beta = event.beta;   // pitch
        const gamma = event.gamma; // roll

        if (alpha == null && beta == null && gamma == null) return;

        attitude.pitch = Number(beta) || 0;
        attitude.roll = Number(gamma) || 0;
        attitude.yaw = Number(alpha) || 0;
        updateUi();

        // 節流後透過 WebSocket 推送姿態（數位雙生）
        const now = Date.now();
        if (now - lastSentAt >= SEND_INTERVAL_MS) {
          lastSentAt = now;
          Esp32Socket.send({
            cmd: 'attitude',
            pitch: +attitude.pitch.toFixed(2),
            roll: +attitude.roll.toFixed(2),
            yaw: +attitude.yaw.toFixed(2),
            t: now,
          }, /* silent */ true);
        }
      }

      /**
       * 請求感測器權限（iOS 13+ 必須由使用者手勢觸發）。
       */
      async function requestPermissionAndStart() {
        try {
          if (
            typeof DeviceOrientationEvent !== 'undefined' &&
            typeof DeviceOrientationEvent.requestPermission === 'function'
          ) {
            const result = await DeviceOrientationEvent.requestPermission();
            if (result !== 'granted') {
              log('裝置姿態權限被拒絕（請至設定允許動作與方向）', 'err');
              return false;
            }
            log('已取得 DeviceOrientation 權限（iOS）', 'ok');
          } else {
            log('此瀏覽器無需額外權限（或非 iOS）', 'info');
          }

          if (enabled) return true;
          window.addEventListener('deviceorientation', onOrientation, true);
          enabled = true;
          el.btnOrientPerm.textContent = '感測器已啟用';
          el.btnOrientPerm.classList.add('opacity-60');
          log('陀螺儀監聽已啟動', 'ok');
          return true;
        } catch (err) {
          log(`啟用感測器失敗：${err && err.message ? err.message : err}`, 'err');
          return false;
        }
      }

      el.btnOrientPerm.addEventListener('click', () => {
        requestPermissionAndStart();
      });

      return {
        requestPermissionAndStart,
        getAttitude: () => ({ ...attitude }),
        isEnabled: () => enabled,
      };
    })();

    // ---------------------------------------------------------------------------
    // 5) Esp32Socket — WebSocket 連線模組
    // ---------------------------------------------------------------------------
    const Esp32Socket = (() => {
      /** @type {WebSocket|null} */
      let socket = null;
      let intentionalClose = false;
      let pingTimer = null;

      function isOpen() {
        return socket && socket.readyState === WebSocket.OPEN;
      }

      /**
       * 正規化使用者輸入的位址。
       * 允許：192.168.4.1 / 192.168.4.1:81 / ws://... / wss://...
       */
      function normalizeUrl(raw) {
        let url = String(raw || '').trim();
        if (!url) return '';
        if (!/^wss?:\/\//i.test(url)) {
          // 預設埠 81（常見於 ESPAsyncWebServer / websockets 範例）
          if (!url.includes(':')) url = `${url}:81`;
          url = `ws://${url}`;
        }
        return url;
      }

      function startPing() {
        stopPing();
        // 週期 ping，協助偵測半死連線；ESP32 可忽略或回 ack
        pingTimer = setInterval(() => {
          send({ cmd: 'ping', t: Date.now() }, true);
        }, 3000);
      }

      function stopPing() {
        if (pingTimer) {
          clearInterval(pingTimer);
          pingTimer = null;
        }
      }

      /**
       * 傳送 JSON 物件。
       * @param {object} payload
       * @param {boolean} [silent=false] 為 true 時不把高頻姿態寫入主控台
       */
      function send(payload, silent = false) {
        if (!isOpen()) {
          if (!silent && payload && payload.cmd === 'grip') {
            log('尚未連線，指令僅更新本機 UI（請先連線 ESP32）', 'warn');
          }
          return false;
        }
        const text = JSON.stringify(payload);
        try {
          socket.send(text);
          if (!silent) {
            log(`TX → ${text}`, 'tx');
          }
          return true;
        } catch (err) {
          log(`傳送失敗：${err && err.message ? err.message : err}`, 'err');
          return false;
        }
      }

      function connect() {
        const url = normalizeUrl(el.wsHost.value);
        if (!url) {
          log('請輸入有效的 WebSocket 位址', 'err');
          return;
        }

        // 已連線則改為斷線
        if (isOpen() || (socket && socket.readyState === WebSocket.CONNECTING)) {
          disconnect();
          return;
        }

        intentionalClose = false;
        el.wsHost.value = url;
        log(`正在連線：${url}`, 'info');
        el.btnConnect.textContent = '連線中…';

        try {
          socket = new WebSocket(url);
        } catch (err) {
          log(`無法建立 WebSocket：${err && err.message ? err.message : err}`, 'err');
          setConnectionUi(false);
          return;
        }

        socket.addEventListener('open', () => {
          setConnectionUi(true);
          log('WebSocket 已連線', 'ok');
          startPing();
          // 連線後同步目前夾爪狀態給硬體
          send({
            cmd: 'grip',
            state: GripActuator.isGripping() ? 'close' : 'open',
            source: 'sync',
            t: Date.now(),
          });
        });

        socket.addEventListener('message', (ev) => {
          const data = typeof ev.data === 'string' ? ev.data : '[binary]';
          log(`RX ← ${data}`, 'ok');
          // 可在此解析 ESP32 回報並更新 UI
          try {
            const msg = JSON.parse(data);
            if (msg && msg.evt === 'status' && msg.msg) {
              log(`硬體狀態：${msg.msg}`, 'warn');
            }
          } catch (_) {
            /* 非 JSON 文字幀也照常顯示 */
          }
        });

        socket.addEventListener('error', () => {
          log('WebSocket 發生錯誤（請確認 IP、埠號與 ESP32 熱點）', 'err');
        });

        socket.addEventListener('close', (ev) => {
          stopPing();
          setConnectionUi(false);
          log(
            intentionalClose
              ? '已主動斷線'
              : `連線關閉（code=${ev.code}）`,
            intentionalClose ? 'warn' : 'err'
          );
          socket = null;
        });
      }

      function disconnect() {
        intentionalClose = true;
        stopPing();
        if (socket) {
          try { socket.close(1000, 'client disconnect'); } catch (_) { /* ignore */ }
          socket = null;
        }
        setConnectionUi(false);
        log('已斷線', 'warn');
      }

      el.btnConnect.addEventListener('click', connect);

      // Enter 鍵也可連線
      el.wsHost.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') connect();
      });

      return { connect, disconnect, send, isOpen, normalizeUrl };
    })();

    // ---------------------------------------------------------------------------
    // 啟動
    // ---------------------------------------------------------------------------
    setConnectionUi(false);
    log('系統就緒。請輸入 ESP32 位址並按「連線」。', 'ok');
    log('iOS 請先點「啟用感測器」以授權陀螺儀。', 'warn');

    // 防止雙擊縮放造成誤觸（部分舊 iOS）
    let lastTouchEnd = 0;
    document.addEventListener('touchend', (e) => {
      const now = Date.now();
      if (now - lastTouchEnd <= 300) e.preventDefault();
      lastTouchEnd = now;
    }, { passive: false });
  </script>
</body>
</html>
